[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

 [tool.ruff]
  line-length = 100
  src = ["src"]

  [tool.ruff.lint]
  select = [
      "E", "W",   # pycodestyle (your indentation/whitespace)
      "F",        # pyflakes (unused imports, undefined names)
      "I",        # isort (auto-sorts your imports)
      "UP",       # pyupgrade (modernizes syntax)
      "B",        # bugbear (real bug patterns)
  ]
